[theme]
base = "dark"
primaryColor = "#42C7B9"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#151C25"
textColor = "#E6EDF3"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "0.7rem"
showWidgetBorder = true

[server]
headless = true
runOnSave = true

[client]
showErrorDetails = "full"
toolbarMode = "viewer"
